<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimmo — Nièvre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header>
        <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                <rect width="40" height="40" rx="10" fill="#2c5f3f"/>
                <path d="M20 10L30 19H27V28H23V23H17V28H13V19H10L20 10Z" fill="white"/>
                <rect x="18" y="14" width="4" height="4" rx="0.5" fill="#2c5f3f" opacity="0.5"/>
            </svg>
            <span>Estimmo</span>
        </div>
        <p class="subtitle">Estimez le prix d'un bien immobilier dans la Nièvre (58) grâce au Machine Learning.</p>
        <div class="badges">
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Données DVF 2025
            </span>
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Modèle ML
            </span>
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                Nièvre (58)
            </span>
        </div>
    </header>

    <main class="card">
        <form id="form-estimation" novalidate>
            <div class="field">
                <label for="type-maison">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Type de bien
                </label>
                <div class="toggle-group">
                    <input type="radio" id="type-maison" name="type_bien" value="true" checked>
                    <label for="type-maison">Maison</label>
                    <input type="radio" id="type-appart" name="type_bien" value="false">
                    <label for="type-appart">Appartement</label>
                </div>
            </div>

            <div class="field">
                <label for="surface-bati">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
                    Surface habitable <span class="unit">(m²)</span>
                </label>
                <input type="number" id="surface-bati" name="surface_bati" min="1" max="10000" step="1" required>
            </div>

            <div class="field">
                <label for="nb-pieces">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v3"/><line x1="12" y1="12" x2="12" y2="12"/></svg>
                    Nombre de pièces
                </label>
                <input type="number" id="nb-pieces" name="nombre_pieces" min="1" max="50" step="1" required>
            </div>

            <div class="field">
                <label for="surface-terrain">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22L12 2l10 20H2z" opacity="0.3"/><path d="M2 22h20"/><path d="M12 2l4 8"/><path d="M12 2L8 10"/></svg>
                    Surface du terrain <span class="unit">(m²)</span>
                </label>
                <input type="number" id="surface-terrain" name="surface_terrain" min="0" max="100000" step="1" required>
            </div>

            <button type="submit" id="btn-submit">
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/><polyline points="9 14 12 17 15 14"/><line x1="12" y1="12" x2="12" y2="17"/></svg>
                Estimer le prix
            </button>
        </form>

        <div id="result" class="result" role="status" aria-live="polite"></div>
    </main>

    <footer>
        <p>Projet fictif — Module 1 Machine Learning · Cécile Louisy</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
